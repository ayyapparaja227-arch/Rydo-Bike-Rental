# ===================================================================
# Rydo Application Configuration
# ===================================================================

# Server Configuration
server.port=8080
spring.application.name=Rydo

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rydodb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Mail Configuration - Brevo SMTP
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_MAIL_USERNAME:your-email@example.com}
spring.mail.password=${BREVO_MAIL_PASSWORD:your-brevo-smtp-key}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# SMS OTP Configuration - Fast2SMS (India)
sms.fast2sms.api-key=${FAST2SMS_API_KEY:your-fast2sms-api-key}
sms.fast2sms.sender-id=RYDO

# SQL Initialization
spring.sql.init.mode=always

# CORS Configuration (Allows React Frontend)
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging
logging.level.com.rydo=DEBUG
logging.level.org.springframework.web=INFO
